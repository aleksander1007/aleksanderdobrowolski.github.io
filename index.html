<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rozwój z chaosu — S = kB ln Ω</title>

  <!-- Typografia identyczna z pierwowzorem -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300;1,400&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070809;
      --bg-card: #0e1013;
      --bg-card-subtle: #13161b;
      --text: #ededed;
      --text-muted: #808691;
      --text-dim: #4f545e;
      --red: #ff3333;
      --red-dim: rgba(255, 51, 51, 0.12);
      --red-glow: rgba(255, 51, 51, 0.35);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.18);
      
      --font-main: 'Archivo', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-hand: 'Caveat', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
    }

    body {
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--red);
      color: #000;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    /* --- Stały górny indeks --- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      padding: 0 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 8, 9, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .brand-id {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-id .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    nav.sections-index {
      display: flex;
      gap: 1.8rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    nav.sections-index a {
      color: var(--text-muted);
      letter-spacing: 0.05em;
      padding: 0.2rem 0.4rem;
    }

    nav.sections-index a:hover {
      color: #fff;
    }

    nav.sections-index a.active-link {
      color: var(--red);
    }

    .header-cta {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      color: #fff;
    }

    .header-cta:hover {
      border-color: var(--red);
      background: var(--red);
      color: #000;
    }

    /* --- Główny kontener czytelniczy --- */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 140px 2rem 100px;
    }

    /* --- Hero: powolny początek --- */
    .hero {
      padding: 3rem 0 6rem;
      border-bottom: 1px solid var(--border);
    }

    .meta-line {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .meta-line::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--red);
    }

    .hero-title {
      font-size: clamp(3.2rem, 8.5vw, 5.8rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .hero-annotation {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-hand);
      font-size: 1.8rem;
      color: var(--red);
      transform: rotate(-3deg);
      margin-bottom: 2rem;
    }

    .lead-text {
      font-size: 1.35rem;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 300;
      max-width: 720px;
      margin-bottom: 2.5rem;
    }

    .lead-text strong {
      color: #fff;
      font-weight: 600;
    }

    .lead-text em {
      font-style: normal;
      color: #fff;
      border-bottom: 1px solid var(--red);
    }

    /* --- Równanie jako interaktywny rdzeń --- */
    .equation-narrative {
      padding: 5rem 0 4rem;
      border-bottom: 1px solid var(--border);
    }

    .equation-header {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--red);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .equation-narrative h2 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      line-height: 1.15;
    }

    .formula-display {
      margin: 3rem 0;
      padding: 3rem 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      position: relative;
    }

    .formula-frame {
      display: inline-flex;
      align-items: baseline;
      gap: 0.6rem;
      font-family: var(--font-mono);
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      border: 1px solid var(--border-strong);
      padding: 0.6rem 2.2rem;
      background: #000;
    }

    .formula-frame span.char {
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .formula-frame span.char:hover {
      color: var(--red);
      transform: translateY(-2px);
    }

    .formula-frame span.sub {
      font-size: 0.6em;
      transform: translateY(0.2em);
    }

    .formula-caption {
      margin-top: 1.8rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Dynamiczny podgląd elementu */
    .breakdown-list {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--border);
    }

    .breakdown-row {
      display: grid;
      grid-template-columns: 80px 180px 1fr;
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
      font-size: 0.95rem;
    }

    .b-symbol {
      font-family: var(--font-mono);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--red);
    }

    .b-science {
      font-family: var(--font-mono);
      color: var(--text-dim);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .b-meaning {
      color: var(--text);
      font-weight: 400;
      line-height: 1.5;
    }

    .b-meaning strong {
      color: #fff;
      font-weight: 600;
    }

    /* --- Eseistyczne sekcje czytane z boku --- */
    .narrative-chapter {
      padding: 6rem 0;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 3rem;
    }

    .chapter-aside {
      position: sticky;
      top: 100px;
      align-self: start;
    }

    .chapter-glyph {
      font-family: var(--font-mono);
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--border-strong);
    }

    .chapter-glyph.highlight {
      color: var(--red);
    }

    .chapter-index {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .chapter-body h2 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .chapter-tag {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--red);
      letter-spacing: 0.05em;
      margin-bottom: 1.8rem;
      display: block;
    }

    .prose-text {
      font-size: 1.08rem;
      line-height: 1.85;
      color: var(--text-muted);
