
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja strona internetowa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        p {
            font-size: 19px;
            color: #cbd5e1;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Witaj na mojej stronie!</h1>

        <p>
            To moja pierwsza strona internetowa
            opublikowana za pomocą GitHub Pages.
        </p>

        <a href="https://github.com/" target="_blank">
            Odwiedź GitHub
        </a>
    </div>
</body>
</html>
